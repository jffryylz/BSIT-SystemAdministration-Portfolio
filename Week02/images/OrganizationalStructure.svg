<text x="76" y="620" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1A2233" text-anchor="start">Information Technology 5  +  Human Resources 4  +  Finance 5  +  Sales &amp; Business Development 6  =  20 employees</text>
<text x="76" y="642" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.8" font-weight="400" fill="#5A6577" text-anchor="start">The Managing Director is a founding partner who concurrently heads Sales &amp; Business Development and is counted within the six-person Sales headcount, so total staffing remains exactly 20.</text>
<text x="52" y="694" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.8" font-weight="400" fill="#5A6577" text-anchor="start">Organizational structure of ABC Startup Solutions.</text>
